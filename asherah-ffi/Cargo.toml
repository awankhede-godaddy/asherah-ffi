[package]
name = "asherah-ffi"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "C ABI (Cobhan buffer format) for the Asherah encryption library, used by .NET, Ruby, and Go bindings."
homepage = "https://github.com/godaddy/asherah-ffi"
repository = "https://github.com/godaddy/asherah-ffi"
readme = "README.md"
keywords = ["asherah", "ffi", "encryption", "kms"]
categories = ["cryptography", "memory-management", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asherah = { version = "1.0.0", path = "../asherah", features = ["sqlite", "mysql", "postgres", "dynamodb"] }
asherah-cobhan = { version = "1.0.0", path = "../asherah-cobhan" }
asherah-config = { version = "1.0.0", path = "../asherah-config" }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
once_cell = "1"
parking_lot = "0.12"
log = "0.4"
zeroize = { version = "1.8", features = ["alloc"] }
stacker = "0.1"

[lints]
workspace = true
