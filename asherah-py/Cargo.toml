[package]
name = "asherah-py"
version = "0.5.56"
edition = "2021"
license = "Apache-2.0"
description = "Python bindings for the Asherah Rust library"
publish = false
homepage = "https://github.com/godaddy/asherah-ffi"
repository = "https://github.com/godaddy/asherah-ffi"
readme = "README.md"
keywords = ["asherah", "python", "ffi", "encryption"]
categories = ["cryptography", "api-bindings"]

[lib]
name = "_asherah"
crate-type = ["cdylib"]

[lints]
workspace = true


[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py38", "generate-import-lib", "serde", "experimental-async"] }
asherah = { version = "1.0.0", path = "../asherah", features = ["sqlite", "mysql", "postgres", "dynamodb"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
asherah-config = { version = "1.0.0", path = "../asherah-config" }
serde_json = "1.0"
anyhow = "1.0"
once_cell = "1.21"
parking_lot = "0.12"
lru = "0.16"
log = "0.4"
zeroize = "1"

[package.metadata.maturin]
module-name = "asherah._asherah"
